      create: false
      rename: false
      delete: false
  - name: en_publications
    label: Publications
    type: file
    path: content/en/publications.json
    format: json
    fields:
    - name: intro
      label: Publications-page introduction
      type: text
    - name: items
      label: Publications & presentations
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title} — {year}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: title
        label: English rendering
        type: string
        required: true
      - name: official_english_title
        label: Official English title (only if verified)
        type: string
      - name: title_fa
        label: Persian title
        type: string
      - name: type
        label: Output type
        type: select
        required: true
        options:
          values:
          - name: journal
            label: Journal article
          - name: conference
            label: Conference paper / presentation
          - name: working_paper
            label: Working paper
          - name: book_chapter
            label: Book chapter
          - name: report
            label: Research report
      - name: status
        label: Publication status
        type: select
        options:
          values:
          - name: accepted
            label: Accepted
          - name: published
            label: Published
          - name: published_or_accepted
            label: Published / accepted (source is ambiguous)
          - name: working_paper
            label: Working paper
          - name: under_review
            label: Under review
      - name: authors
        label: Authors
        type: string
        list: true
      - name: corresponding_author
        label: Corresponding author
        type: string
      - name: venue
        label: Venue as reported
        type: string
      - name: venue_english_rendering
        label: English venue rendering
        type: string
      - name: year
        label: Year
        type: string
      - name: doi
        label: DOI (verified only)
        type: string
      - name: url
        label: Publication URL (verified only)
        type: string
      - name: abstract
        label: Abstract / چکیده
        type: text
      - name: keywords
        label: Keywords / کلیدواژه‌ها
        type: string
        list: true
      - name: volume
        label: Volume (verified only)
        type: string
      - name: issue
        label: Issue (verified only)
        type: string
      - name: pages
        label: Pages (verified only)
        type: string
      - name: pdf
        label: PDF / فایل مقاله
        type: file
        options:
          media: publication_files
          extensions:
          - pdf
          rename: safe
      - name: data_url
        label: Data URL / پیوند داده
        type: string
      - name: code_url
        label: Code URL / پیوند کد
        type: string
      - name: replication_url
        label: Replication URL / بسته بازتولید
        type: string
      - name: note
        label: Note
        type: text
      - name: featured
        label: Feature on CV/home
        type: boolean
    operations:
      create: false
      rename: false
      delete: false
