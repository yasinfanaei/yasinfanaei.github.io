settings:
  content:
    merge: true
content:
- name: english
  label: English
  type: group
  items:
  - name: en_profile
    label: Profile & Contact
    type: file
    path: content/en/profile.json
    format: json
    fields:
    - name: name
      label: Full name
      type: string
      required: true
    - name: headline
      label: Academic headline
      type: string
      required: true
    - name: affiliation
      label: Affiliation
      type: string
      required: true
    - name: location
      label: Public location
      type: string
    - name: email
      label: Public email
      type: string
      required: true
    - name: eyebrow
      label: Home-page eyebrow
      type: string
    - name: bio
      label: Research profile
      type: text
    - name: short_bio
      label: Short biography
      type: text
    - name: links
      label: Academic profile links
      type: object
      fields:
      - name: google_scholar
        label: Google Scholar
        type: string
      - name: orcid
        label: ORCID
        type: string
      - name: researchgate
        label: ResearchGate
        type: string
      - name: linkedin
        label: LinkedIn
        type: string
      - name: github
        label: GitHub
        type: string
      - name: institutional_profile
        label: Institutional profile
        type: string
    operations:
      create: false
      rename: false
      delete: false
  - name: en_education
    label: Education
    type: file
    path: content/en/education.json
    format: json
    fields:
    - name: items
      label: Degrees
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{degree} — {institution}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: degree
        label: Degree
        type: string
        required: true
      - name: institution
        label: Institution
        type: string
        required: true
      - name: field
        label: Field
        type: string
      - name: period
        label: Period / status
        type: string
      - name: gpa
        label: GPA
        type: string
      - name: note
        label: Note
        type: text
    operations:
      create: false
      rename: false
      delete: false
  - name: en_research
    label: Research
    type: file
    path: content/en/research.json
    format: json
    fields:
    - name: intro
      label: Research-page introduction
      type: text
    - name: interests
      label: Research interests
      type: string
      list: true
    - name: themes
      label: Research themes
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
    - name: thesis
      label: Master's thesis
      type: object
      fields:
      - name: id
        label: Stable ID
        type: string
        required: true
        pattern: ^[a-z0-9-]+$
      - name: title
        label: English rendering
        type: string
        required: true
      - name: title_fa
        label: Persian title
        type: string
      - name: degree
        label: Degree
        type: string
      - name: institution
        label: Institution
        type: string
      - name: supervisor
        label: Supervisor
        type: string
      - name: grade
        label: Grade
        type: string
      - name: note
        label: Note
        type: text
