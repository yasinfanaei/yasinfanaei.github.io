    label: Homepage sections / بخش‌های صفحه اصلی
    type: object
    list:
      collapsible:
        collapsed: false
        summary: '{id}'
    fields:
    - name: id
      label: Section ID (hero/about/research/education)
      type: select
      options:
        values:
        - hero
        - about
        - research
        - education
        - news
    - name: enabled
      label: Visible
      type: boolean
  - name: theme
    label: Theme / پوسته
    type: object
    fields:
    - name: default_mode
      label: Default theme
      type: select
      options:
        values:
        - name: system
          label: Follow system / سیستم
        - name: light
          label: Light / روشن
        - name: dark
          label: Dark / تیره
  - name: analytics
    label: Analytics / آمار بازدید (اختیاری)
    type: object
    fields:
    - name: enabled
      label: Enable analytics
      type: boolean
    - name: provider
      label: Provider
      type: select
      options:
        values:
        - name: google_analytics
          label: Google Analytics 4
    - name: measurement_id
      label: GA4 Measurement ID (G-...)
      type: string
      pattern: ^$|^G-[A-Z0-9]+$
      description: Leave blank while analytics is disabled.
  - name: seo
    label: SEO & indexing / سئو و نمایه‌سازی
    type: object
    fields:
    - name: site_url
      label: Public site URL
      type: string
      required: true
      pattern: ^https://.+
    - name: structured_data_enabled
      label: Enable Person/ProfilePage structured data
      type: boolean
    - name: indexing_enabled
      label: Allow search-engine indexing
      type: boolean
  operations:
    create: false
    rename: false
    delete: false
