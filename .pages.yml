      label: Sticky header
      type: boolean
    - name: show_shadows
      label: Show shadows
      type: boolean
    - name: show_language_switch
      label: Show EN/فارسی switch
      type: boolean
    - name: show_footer
      label: Show footer
      type: boolean
    - name: show_social_links_on_home
      label: Show academic links on homepage
      type: boolean
    - name: show_brand_name
      label: Show name next to logo / نمایش نام کنار لوگو
      type: boolean
    - name: show_theme_switch
      label: Show Light/Dark/System switch
      type: boolean
    - name: show_search
      label: Show global search
      type: boolean
