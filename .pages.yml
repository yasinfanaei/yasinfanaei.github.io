- name: design_branding
  label: Design & Branding — ظاهر و تنظیمات اصلی
  type: file
  path: content/settings/design.json
  format: json
  fields:
  - name: branding
    label: Branding / برندینگ
    type: object
    fields:
    - name: logo
      label: Header logo / لوگوی سربرگ
      type: image
      options:
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        - svg
        rename: safe
        media: images
    - name: favicon
      label: Favicon / آیکون سایت
      type: image
      options:
        extensions:
        - svg
        - png
        - jpg
        - jpeg
        - webp
        rename: safe
        media: images
    - name: profile_image
      label: Profile photo / عکس پروفایل
      type: image
      options:
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        rename: safe
        media: images
    - name: cv_pdf
      label: CV PDF / رزومه PDF
      type: file
      options:
        extensions:
        - pdf
        rename: safe
        media: documents
    - name: cv_docx
      label: CV Word / رزومه Word
      type: file
      options:
        extensions:
        - docx
        rename: safe
        media: documents
    - name: open_graph_image
      label: Social preview image / تصویر اشتراک‌گذاری
      type: image
      options:
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        rename: safe
        media: images
  - name: colors
    label: Colors / رنگ‌ها
    type: object
    fields:
    - name: background
      label: Background
      type: string
    - name: surface
      label: Cards / surface
      type: string
    - name: text
      label: Main text
      type: string
    - name: muted
      label: Muted text
      type: string
    - name: line
      label: Borders
      type: string
    - name: accent
      label: Primary accent
      type: string
    - name: accent_secondary
      label: Secondary accent
      type: string
    - name: soft
      label: Soft background
      type: string
  - name: dark_colors
    label: Dark theme colors / رنگ‌های حالت تیره
    type: object
    fields:
    - name: background
      label: Background
      type: string
    - name: surface
      label: Cards / surface
      type: string
    - name: text
      label: Main text
      type: string
    - name: muted
      label: Muted text
      type: string
    - name: line
      label: Borders
      type: string
    - name: accent
      label: Primary accent
      type: string
    - name: accent_secondary
      label: Secondary accent
      type: string
    - name: soft
      label: Soft background
      type: string
  - name: typography
    label: Typography / تایپوگرافی
    type: object
    fields:
