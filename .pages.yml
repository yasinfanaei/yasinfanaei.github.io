media:
- name: images
  label: Images / تصاویر
  input: assets/uploads/images
  output: assets/uploads/images
  rename: safe
  categories:
  - image
- name: documents
  label: CV & Documents / رزومه و اسناد
  input: assets/uploads/documents
  output: assets/uploads/documents
  rename: safe
  categories:
  - document
- name: publication_files
  label: Publication files / فایل‌های پژوهشی
